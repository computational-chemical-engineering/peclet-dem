name: CI

# Host (Kokkos OpenMP/Serial) CI for peclet.dem — suite/docs/QUALITY_PLAN.md §3.D ("CI that is honest"):
#   * single-rank : the module + the kernel ctests (tests/kokkos, 8) + the ArborX broad-phase / pipeline
#                   ctests (tests/arborx, 2) + the Python test suite (tests/python as pytest, 1 ctest),
#                   all from ONE tree built with -DPECLET_DEM_BUILD_TESTS=ON. `ctest -LE bench` — nothing
#                   is labelled `bench` today, so this runs everything `ctest -N` lists. A last step
#                   configures + compiles one kernel TU against the DEFAULT PECLET_CORE_TAG (the release
#                   pin) so an unfetchable or header-stale pin fails here, not in the release sdist build.
#   * mpi         : the same tree with -DPECLET_DEM_MPI=ON, core as the SIBLING checkout (the other
#                   PecletDeps path): the 24 tests/kokkos_mpi ctests + the 12 mpirun-launched Python
#                   MPI tests (tests/python/mpi, on core's peclet.core.mpi + mpi4py) at np = 1, 2 and 4
#                   (np = 4 oversubscribed on the 4-core runner). Missing pieces SKIP (exit 77), never pass.
# The hosted runners have 4 cores / 16 GB: every job bounds the OpenMP pool (OMP_NUM_THREADS) and runs
# ctest -j1 — an unbounded pool starved the runner ("The hosted runner lost communication").
# GPU (CUDA/HIP) backends are not exercisable on free runners; they are covered by the local trees.

on:
  push:
    branches: [main, "**"]
  pull_request:
  workflow_dispatch:

env:
  KOKKOS_TAG: "5.1.1"        # keep in lockstep with ../tools/bootstrap_deps.sh + cmake/PecletDeps.cmake
  ARBORX_TAG: "v2.1"
  NANOBIND_VERSION: "2.13.0" # pinned CI input (the wheel build pins its own via pyproject.toml)

jobs:
  single-rank:
    name: single-rank (kokkos + arborx + python ctests)
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "2"
      OMP_PROC_BIND: "false"
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libomp-dev python3-dev python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install "nanobind==${NANOBIND_VERSION}" numpy scipy scikit-image pytest

      - name: Cache Kokkos + ArborX install
        id: deps-cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/deps-install
          key: kokkos-${{ env.KOKKOS_TAG }}-arborx-${{ env.ARBORX_TAG }}-openmp-${{ runner.os }}

      - name: Build Kokkos (OpenMP + Serial) + ArborX
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          PREFIX="$GITHUB_WORKSPACE/deps-install"
          git clone --depth 1 --branch "$KOKKOS_TAG" https://github.com/kokkos/kokkos.git /tmp/kokkos
          cmake -S /tmp/kokkos -B /tmp/kokkos/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DKokkos_ENABLE_OPENMP=ON -DKokkos_ENABLE_SERIAL=ON \
            -DCMAKE_INSTALL_PREFIX="$PREFIX"
          cmake --build /tmp/kokkos/build -j && cmake --install /tmp/kokkos/build
          # ArborX is header-only; it just needs to find the Kokkos we built.
          git clone --depth 1 --branch "$ARBORX_TAG" https://github.com/arborx/ArborX.git /tmp/arborx
          cmake -S /tmp/arborx -B /tmp/arborx/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_PREFIX_PATH="$PREFIX" -DCMAKE_INSTALL_PREFIX="$PREFIX"
          cmake --install /tmp/arborx/build

      - name: Configure + build (module + tests, core main)
        run: |
          # main builds against core's main (the default PECLET_CORE_TAG is the last core release,
          # which lags the headers main already uses; the last step below checks that pin).
          cmake -S . -B build -G Ninja \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/deps-install" \
            -DPECLET_CORE_TAG=main \
            -DPECLET_DEM_BUILD_TESTS=ON
          cmake --build build -j
          ctest --test-dir build -N

      - name: Import smoke test
        run: PYTHONPATH=$PWD/build python3 -c "import peclet.dem; print('peclet.dem import OK')"

      - name: ctest -LE bench (kokkos + arborx + python)
        run: ctest --test-dir build -j1 --timeout 1200 --output-on-failure -LE bench

      - name: Configure + one kernel TU against the DEFAULT PECLET_CORE_TAG (the release pin)
        run: |
          # No -DPECLET_CORE_TAG: cmake/PecletDeps.cmake's default is the core tag a release sdist /
          # wheel fetches, so this catches a pin that does not exist, cannot be fetched, or whose
          # headers no longer match what src/ includes (test_narrowphase pulls dem_portable.hpp ->
          # peclet/core/geom). Configure + ONE small TU, not the whole module.
          grep -n 'set(PECLET_CORE_TAG' cmake/PecletDeps.cmake
          cmake -S . -B build_pin -G Ninja \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/deps-install" \
            -DPECLET_DEM_BUILD_TESTS=ON
          cmake --build build_pin -j --target test_narrowphase

  mpi:
    name: mpi (kokkos_mpi + python/mpi, np=1,2,4)
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OMP_PROC_BIND: "false"
    steps:
      - name: Checkout dem
        uses: actions/checkout@v7
        with:
          path: dem

      - name: Checkout core (sibling; the header source AND peclet.core.mpi for the Python MPI tests)
        uses: actions/checkout@v7
        with:
          repository: computational-chemical-engineering/peclet-core
          path: core

      - name: Install toolchain (+ OpenMPI, mpi4py)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libomp-dev python3-dev python3-pip \
            libopenmpi-dev openmpi-bin
          python3 -m pip install --upgrade pip
          python3 -m pip install "nanobind==${NANOBIND_VERSION}" numpy scipy scikit-image pytest mpi4py
          mpirun --version

      - name: Cache Kokkos + ArborX install
        id: deps-cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/deps-install
          key: kokkos-${{ env.KOKKOS_TAG }}-arborx-${{ env.ARBORX_TAG }}-openmp-${{ runner.os }}

      - name: Build Kokkos (OpenMP + Serial) + ArborX
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          PREFIX="$GITHUB_WORKSPACE/deps-install"
          git clone --depth 1 --branch "$KOKKOS_TAG" https://github.com/kokkos/kokkos.git /tmp/kokkos
          cmake -S /tmp/kokkos -B /tmp/kokkos/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DKokkos_ENABLE_OPENMP=ON -DKokkos_ENABLE_SERIAL=ON \
            -DCMAKE_INSTALL_PREFIX="$PREFIX"
          cmake --build /tmp/kokkos/build -j && cmake --install /tmp/kokkos/build
          git clone --depth 1 --branch "$ARBORX_TAG" https://github.com/arborx/ArborX.git /tmp/arborx
          cmake -S /tmp/arborx -B /tmp/arborx/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_PREFIX_PATH="$PREFIX" -DCMAKE_INSTALL_PREFIX="$PREFIX"
          cmake --install /tmp/arborx/build

      - name: Build peclet.core.mpi (core/python, host)
        working-directory: core
        run: |
          cmake -S python -B python/build -G Ninja -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/deps-install"
          cmake --build python/build -j --target mpi_bindings
          PYTHONPATH=$PWD/python/build python3 -c "from peclet.core import mpi; print('peclet.core.mpi OK')"

      - name: Configure + build (module + all tests, PECLET_DEM_MPI, sibling core)
        working-directory: dem
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/deps-install" \
            -DPECLET_DEM_MPI=ON -DPECLET_DEM_BUILD_TESTS=ON \
            -DMPIEXEC_EXECUTABLE=/usr/bin/mpirun -DMPIEXEC_PREFLAGS=--oversubscribe
          cmake --build build -j
          ctest --test-dir build -N -L mpi

      - name: MPI ctests np=1 (C++ + Python)
        working-directory: dem
        run: PYTHONPATH="$GITHUB_WORKSPACE/core/python/build" ctest --test-dir build -j1 --timeout 1200 --output-on-failure -L mpi -R '_np1$'

      - name: MPI ctests np=2 (C++ + Python)
        working-directory: dem
        run: PYTHONPATH="$GITHUB_WORKSPACE/core/python/build" ctest --test-dir build -j1 --timeout 1200 --output-on-failure -L mpi -R '_np2$'

      - name: MPI ctests np=4 (C++ + Python), oversubscribed
        working-directory: dem
        run: PYTHONPATH="$GITHUB_WORKSPACE/core/python/build" ctest --test-dir build -j1 --timeout 1200 --output-on-failure -L mpi -R '_np4$'
